# Rate limit only POST requests (the expensive LLM calls).
# An empty key means "do not limit", so GET requests are free.
map $request_method $post_limit_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $post_limit_key zone=ticket_post:10m rate=10r/m;

# Behind Caddy, the client IP arrives in X-Forwarded-For.
# Trust it only when the request comes from a private Docker network.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # JSON error for rate limited requests, so the UI can show a clear message.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"Too many requests. Please wait a minute and try again."}';
    }

    # The batch endpoint is disabled on the public demo (the UI does not use it).
    location = /api/tickets/batch {
        default_type application/json;
        return 403 '{"detail":"This endpoint is disabled on the public demo."}';
    }

    # Forward API calls to the FastAPI container.
    location /api/ {
        default_type application/json;

        # Deleting tickets is disabled on the public demo.
        if ($request_method = DELETE) {
            return 403 '{"detail":"Deleting tickets is disabled on the public demo."}';
        }

        limit_req zone=ticket_post burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Built assets have hashed file names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
