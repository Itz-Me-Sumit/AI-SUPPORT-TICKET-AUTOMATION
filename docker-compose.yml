services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Keep the database inside the mounted volume.
      DATABASE_URL: sqlite:///./data/tickets.db
    volumes:
      - backend-data:/app/data
    ports:
      # Optional: exposes Swagger docs at http://localhost:8000/docs
      # Remove this block in production if the API should stay private.
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
